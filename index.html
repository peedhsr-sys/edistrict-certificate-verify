<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UP e-District Encoder Tool with QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 700px; /* QR ke liye thoda bada kiya */
            width: 100%;
        }
        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        /* Left and Right layout block */
        .result-layout {
            margin-top: 25px;
            padding: 20px;
            background-color: #e9ecef;
            border-radius: 5px;
            display: none; /* Pehle se chhupa rahega */
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }
        .left-side {
            flex: 1;
            word-break: break-all;
        }
        .right-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .right-side p {
            margin: 5px 0 0 0;
            font-size: 12px;
            color: #666;
            font-weight: bold;
        }
        .result-layout a {
            color: #28a745;
            text-decoration: none;
            font-weight: bold;
        }
        .result-layout a:hover {
            text-decoration: underline;
        }
        /* Mobile screen ke liye adjustment */
        @media (max-width: 600px) {
            .result-layout {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>e-District Link & QR Generator</h2>
    
    <label for="appNo">Application Number:</label>
    <input type="text" id="appNo" placeholder="उदा: 261900010064472">

    <label for="certNo">Certificate Number:</label>
    <input type="text" id="certNo" placeholder="उदा: 602261007721">

    <button onclick="generateEverything()">Link & QR Generate Karein</button>

    <div id="resultBox" class="result-layout">
        
        <div class="left-side">
            <p><strong>Combined Text:</strong> <span id="combinedText"></span></p>
            <p><strong>Encoded Base64 Code:</strong> <br><code id="encodedCode" style="background:#fff; padding:2px 5px; border:1px solid #ddd;"></code></p>
            <p><strong>Final Verification Link:</strong> <br>
                <a id="finalLink" href="#" target="_blank">Yahan Click Karein</a>
            </p>
        </div>

        <div class="right-side">
            <div id="qrcode"></div>
            <p></p>
        </div>

    </div>
</div>

<script>
// QR Code object ko store karne ke liye variable
var qrcodeContainer = null;

function generateEverything() {
    var appNo = document.getElementById("appNo").value.trim();
    var certNo = document.getElementById("certNo").value.trim();
    var resultBox = document.getElementById("resultBox");
    var combinedTextSpan = document.getElementById("combinedText");
    var encodedCodeStyle = document.getElementById("encodedCode");
    var finalLinkA = document.getElementById("finalLink");
    var qrcodeDiv = document.getElementById("qrcode");

    if (appNo === "" || certNo === "") {
        alert("Kripya dono numbers daalein!");
        return;
    }

    try {
        // Dono numbers ko comma se jodna
        var combinedText = appNo + "," + certNo;
        
        // Base64 encode karna
        var encodedString = btoa(combinedText);
        
        // Final URL construct karna
        var baseUrl = "https://edistrict.up.gov.in/edistrictup/certVerify.aspx?application_no=";
        var fullUrl = baseUrl + encodedString;

        // Screen par data set karna
        combinedTextSpan.innerText = combinedText;
        encodedCodeStyle.innerText = encodedString;
        finalLinkA.href = fullUrl;
        finalLinkA.innerText = fullUrl;
        
        // Purane QR code ko saaf karna taaki naya ban sake
        qrcodeDiv.innerHTML = "";

        // Naya QR Code generate karna (150x150 size ka)
        qrcodeContainer = new QRCode(qrcodeDiv, {
            text: fullUrl,
            width: 150,
            height: 150,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // Result box ko flex layout ke sath display karna
        resultBox.style.display = "flex";
    } catch (e) {
        alert("Kuch gaddbad hui! Kripya sahi numbers daalein.");
        resultBox.style.display = "none";
    }
}
</script>

</body>
</html>
