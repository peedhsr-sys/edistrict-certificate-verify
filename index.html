<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bittu</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            /* 🚫 टेक्स्ट सिलेक्शन को ब्लॉक करने के लिए */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .main-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            flex: 1 1 400px; 
            text-align: center;
        }
        
        h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 22px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #555;
            text-align: left;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        
        .result-layout {
            margin-top: 30px;
            padding: 20px;
            background-color: #e9ecef;
            border-radius: 8px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .secret-btn { background-color: #28a745; width: auto; padding: 12px 30px; }
        .secret-btn:hover { background-color: #218838; }

        .download-btn {
            background-color: #17a2b8;
            color: white;
            width: auto;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 6px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .download-btn:hover { background-color: #138496; }

        #qrcode {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        #certImage {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            display: none;
            margin-bottom: 10px;
            /* फोटो पर राईट क्लिक इनेबल करने के लिए कर्सर पॉइंटर */
            cursor: pointer;
        }

        .instruction-box {
            background-color: #e2e3e5;
            color: #383d41;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }

        /* ⚠️ वार्निंग मैसेज का नया और बेहतर डिज़ाइन (Toast Notification) */
        #custom-menu {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #dc3545;
            color: #fff;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
            z-index: 999999;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="custom-menu">⚠️ सुरक्षा के कारण यह विकल्प बंद है!</div>

<div class="main-wrapper">

    <div class="container">
        <h2>e-District Verification Direct-</h2>
        <label for="appNo">आवेदन क्र0:</label>
        <input type="text" id="appNo" placeholder="उदा: 261900010064472">

        <label for="certNo">प्रमाणपत्र क्र0:</label>
        <input type="text" id="certNo" placeholder="उदा: 602261007721">

        <button onclick="generateEverything()">Submit Details</button>

        <div id="resultBox" class="result-layout">
            <button class="secret-btn" id="secretBtn" onclick="openSecret()">Click Here</button>
            <div id="qrcode"></div>
            <button class="download-btn" onclick="downloadQR()">Download QR Code</button>
        </div>
    </div>

    <div class="container">
        <h2>Certificate Photo Viewer</h2>
        <label for="photoAppNo">आवेदन क्र0:</label>
        <input type="text" id="photoAppNo" placeholder="उदा: 261900010064474">

        <button onclick="fetchPhoto()" style="background-color: #ff9800;">Show Photo</button>

        <div id="photoResultBox" class="result-layout">
            <img id="certImage" src="" alt="Applicant Photo">
            <div class="instruction-box">
                👉 फोटो को सेव करने के लिए उस पर Right-Click या Long Press करें।
            </div>
        </div>
    </div>

</div>

<script>
(function() {
    // 1. डोमेन लॉक: क्लोनिंग रोकने के लिए
    var allowedDomain = "peedhsr-sys.github.io";
    if (!window.location.hostname.includes(allowedDomain) && window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1") {
        document.body.innerHTML = "<h1 style='color:red; margin-top:100px; text-align:center;'>Error: Unauthorized Clone Detected!</h1>";
        window.location.href = "https://google.com";
        return;
    }

    var menu = document.getElementById('custom-menu');

    // 2. स्मार्ट राइट-क्लिक कंट्रोल (सिर्फ फोटो पर काम करेगा)
    document.addEventListener('contextmenu', function(e) {
        // अगर क्लिक की गई चीज़ की ID "certImage" है (यानी हमारी फोटो), तो राइट-क्लिक होने दो
        if (e.target && e.target.id === 'certImage') {
            return true; 
        }
        
        // अगर फोटो के अलावा कहीं और राइट-क्लिक हुआ है, तो ब्लॉक कर दो और मैसेज दिखाओ
        e.preventDefault();
        e.stopPropagation();
        
        menu.style.display = 'block'; // मैसेज दिखाओ
        
        // 2.5 सेकंड बाद मैसेज को छुपा दो
        setTimeout(function() {
            menu.style.display = 'none';
        }, 2500);
    }, true);

    // 3. शॉर्टकट्स को रोकना (F12, Ctrl+Shift+I, Ctrl+U)
    document.addEventListener('keydown', function(e) {
        if (
            e.keyCode === 123 || 
            (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
            (e.ctrlKey && e.keyCode === 85)
        ) {
            e.stopPropagation();
            e.preventDefault();
            return false;
        }
    }, true);

    // 4. डिबगर फ्रीज लूप
    setInterval(function() {
        debugger;
    }, 100);
})();
</script>
