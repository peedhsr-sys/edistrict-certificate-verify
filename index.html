<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UP e-District Link Generator Tool</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
            display: none;
            word-break: break-all;
        }
        .result-box a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        .result-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>e-District Link Generator</h2>
    
    <label for="encodedInput">Base64 कोड पेस्ट करें:</label>
    <input type="text" id="encodedInput" placeholder="उदा: MjYxOTAw...">

    <button onclick="generateLink()">लिंक जेनरेट करें</button>

    <div id="resultBox" class="result-box">
        <p><strong>डिकोड किया गया नंबर:</strong> <span id="decodedNo"></span></p>
        <p><strong>डायरेक्ट लिंक:</strong> <br>
            <a id="finalLink" href="#" target="_blank">यहाँ क्लिक करें</a>
        </p>
    </div>
</div>

<script>
function generateLink() {
    var inputData = document.getElementById("encodedInput").value.trim();
    var resultBox = document.getElementById("resultBox");
    var decodedNoSpan = document.getElementById("decodedNo");
    var finalLinkA = document.getElementById("finalLink");

    if (inputData === "") {
        alert("कृपया कोड डालें!");
        return;
    }

    try {
        // Base64 डिकोड करने का जावास्क्रिप्ट फंक्शन (atob)
        var decodedString = atob(inputData);
        
        // आपका सरकारी यूआरएल जिसके आगे नंबर जोड़ना है
        var baseUrl = "https://edistrict.up.gov.in/eDistrict/Certificate/Caste/Forms/printCert.aspx?application_no=";
        
        // पूरा फाइनल लिंक
        var fullUrl = baseUrl + decodedString;

        // स्क्रीन पर दिखाना
        decodedNoSpan.innerText = decodedString;
        finalLinkA.href = fullUrl;
        finalLinkA.innerText = fullUrl;
        
        resultBox.style.display = "block";
    } catch (e) {
        alert("गलत कोड! कृपया सही Base64 कोड डालें।");
        resultBox.style.display = "none";
    }
}
</script>

</body>
</html>
