<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UP e-District Encoder Tool</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
            display: none;
            word-break: break-all;
        }
        .result-box a {
            color: #28a745;
            text-decoration: none;
            font-weight: bold;
        }
        .result-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>e-District Link Encoder Tool</h2>
    
    <label for="appNo">Application Number:</label>
    <input type="text" id="appNo" placeholder="उदा: 261900010064472">

    <label for="certNo">Certificate Number:</label>
    <input type="text" id="certNo" placeholder="उदा: 602261007721">

    <button onclick="generateEncodedLink()">Link Generate Karein</button>

    <div id="resultBox" class="result-box">
        <p><strong>Combined Text:</strong> <span id="combinedText"></span></p>
        <p><strong>Encoded Base64 Code:</strong> <br><code id="encodedCode" style="background:#fff; padding:2px 5px; border:1px solid #ddd;"></code></p>
        <p><strong>Final Verification Link:</strong> <br>
            <a id="finalLink" href="#" target="_blank">Yahan Click Karein</a>
        </p>
    </div>
</div>

<script>
function generateEncodedLink() {
    var appNo = document.getElementById("appNo").value.trim();
    var certNo = document.getElementById("certNo").value.trim();
    var resultBox = document.getElementById("resultBox");
    var combinedTextSpan = document.getElementById("combinedText");
    var encodedCodeStyle = document.getElementById("encodedCode");
    var finalLinkA = document.getElementById("finalLink");

    if (appNo === "" || certNo === "") {
        alert("Kripya dono numbers daalein!");
        return;
    }

    try {
        // Dono numbers ko comma se jodna (jaise govt site leti hai)
        var combinedText = appNo + "," + certNo;
        
        // JavaScript me string ko Base64 encode karne ke liye btoa use hota hai
        var encodedString = btoa(combinedText);
        
        // Aapka naya wala URL jiske aage encode kiya hua code lagana hai
        var baseUrl = "https://edistrict.up.gov.in/edistrictup/certVerify.aspx?application_no=";
        var fullUrl = baseUrl + encodedString;

        // Screen par data dikhana
        combinedTextSpan.innerText = combinedText;
        encodedCodeStyle.innerText = encodedString;
        finalLinkA.href = fullUrl;
        finalLinkA.innerText = fullUrl;
        
        resultBox.style.display = "block";
    } catch (e) {
        alert("Kuch gaddbad hui! Kripya sahi numbers daalein.");
        resultBox.style.display = "none";
    }
}
</script>

</body>
</html>
