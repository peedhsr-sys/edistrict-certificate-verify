<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UP e-District Encoder Tool & Photo Viewer</title>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* दोनों बॉक्स को अगल-बगल रखने के लिए लेआउट */
        .main-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            flex: 1 1 400px; 
            text-align: center;
        }
        
        h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 22px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #555;
            text-align: left;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        
        /* Result Area Design */
        .result-layout {
            margin-top: 30px;
            padding: 20px;
            background-color: #e9ecef;
            border-radius: 8px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .secret-btn {
            background-color: #28a745;
            width: auto;
            padding: 12px 30px;
        }
        .secret-btn:hover {
            background-color: #218838;
        }

        .download-btn {
            background-color: #17a2b8;
            color: white;
            width: auto;
            padding: 10px 25px;
            font-size: 16px;
            text-decoration: none;
            border-radius: 6px;
            display: inline-block;
            font-weight: bold;
        }
        .download-btn:hover {
            background-color: #138496;
            color: white;
        }

        #qrcode {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* Photo Viewer Specific */
        #certImage {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            display: none;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="main-wrapper">

    <!-- =========== Box 1: पुराना वाला Verification Tool =========== -->
    <div class="container">
        <h2>e-District Verification Tool</h2>
        
        <label for="appNo">Application Number:</label>
        <input type="text" id="appNo" placeholder="उदा: 261900010064472">

        <label for="certNo">Certificate Number:</label>
        <input type="text" id="certNo" placeholder="उदा: 602261007721">

        <button onclick="generateEverything()">Submit Details</button>

        <div id="resultBox" class="result-layout">
            <button class="secret-btn" id="secretBtn" onclick="openSecret()">Click Here</button>
            
            <div id="qrcode"></div>
            
            <button class="download-btn" onclick="downloadQR()" style="border:none; cursor:pointer;">Download QR Code</button>
        </div>
    </div>

    <!-- =========== Box 2: Photo Viewer Tool =========== -->
    <div class="container">
        <h2>Certificate Photo Viewer</h2>
        
        <label for="photoAppNo">Application Number:</label>
        <input type="text" id="photoAppNo" placeholder="उदा: 261900010064474">

        <button onclick="fetchPhoto()" style="background-color: #ff9800;">Show Photo</button>

        <div id="photoResultBox" class="result-layout">
            <img id="certImage" src="" alt="Applicant Photo">
            <button id="downloadPhotoBtn" class="download-btn" onclick="forceDownloadPhoto()" style="border:none; cursor:pointer;">Download Photo</button>
        </div>
    </div>

</div>

<script>
// ==========================================
// 1. पुराने टूल की स्क्रिप्ट (बिना किसी बदलाव के)
// ==========================================
let hiddenUrlBase64 = "";

function generateEverything() {
    let appNo = document.getElementById("appNo").value.trim();
    let certNo = document.getElementById("certNo").value.trim();
    let resultBox = document.getElementById("resultBox");
    let qrcodeDiv = document.getElementById("qrcode");

    if (appNo === "" || certNo === "") {
        alert("कृपया एप्लीकेशन और सर्टिफिकेट नंबर दोनों डालें!");
        return;
    }

    try {
        let combinedText = appNo + "," + certNo;
        let encodedString = btoa(combinedText);
        let fullUrl = "https://edistrict.up.gov.in/edistrictup/certVerify.aspx?application_no=" + encodedString;

        hiddenUrlBase64 = btoa(fullUrl);
        qrcodeDiv.innerHTML = "";

        new QRCode(qrcodeDiv, {
            text: fullUrl,
            width: 150,
            height: 150,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        resultBox.style.display = "flex";
    } catch (e) {
        alert("कुछ गड़बड़ हुई! कृपया सही नंबर डालें।");
        resultBox.style.display = "none";
    }
}

function openSecret() {
    if(!hiddenUrlBase64) return;
    
    let url = atob(hiddenUrlBase64);
    let windowFeatures = "toolbar=no, location=no, directories=no, status=no, menubar=no, scrollbars=yes, resizable=yes, width=900, height=700, top=100, left=200";
    
    window.open(url, "VerificationWindow", windowFeatures);
}

function downloadQR() {
    let canvas = document.querySelector("#qrcode canvas");
    if (canvas) {
        let link = document.createElement("a");
        link.href = canvas.toDataURL("image/png");
        link.download = "eDistrict_QRCode.png";
        link.click();
    } else {
        let img = document.querySelector("#qrcode img");
        if (img && img.src) {
            let link = document.createElement("a");
            link.href = img.src;
            link.download = "eDistrict_QRCode.png";
            link.click();
        } else {
            alert("QR Code डाउनलोड करने में समस्या आ रही है।");
        }
    }
}

// ==========================================
// 2. नए फोटो टूल की स्क्रिप्ट (Advance Direct Download)
// ==========================================
let currentPhotoUrl = "";
let currentPhotoAppNo = "";

function fetchPhoto() {
    let photoAppNo = document.getElementById("photoAppNo").value.trim();
    let photoResultBox = document.getElementById("photoResultBox");
    let certImage = document.getElementById("certImage");

    if (photoAppNo === "") {
        alert("कृपया फोटो देखने के लिए Application Number डालें!");
        return;
    }

    currentPhotoAppNo = photoAppNo;
    currentPhotoUrl = "https://edistrict.up.gov.in/edistrict/showphotoCert.aspx?appid=" + photoAppNo;

    certImage.src = currentPhotoUrl;
    certImage.style.display = "block";
    photoResultBox.style.display = "flex";
}

// एडवांस लेवल डाउनलोड: Proxy के जरिए सिक्योरिटी बायपास करना
function forceDownloadPhoto() {
    if (!currentPhotoUrl) return;

    let btn = document.getElementById("downloadPhotoBtn");
    btn.innerText = "Downloading..."; // लोडिंग स्टेट

    // CORS Bypass करने के लिए फ्री API (Proxy) का उपयोग
    let proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(currentPhotoUrl);

    fetch(proxyUrl)
        .then(response => response.blob())
        .then(blob => {
            // फोटो का कच्चा डेटा (Blob) निकालकर उसे लोकल फाइल बना देना
            let blobUrl = window.URL.createObjectURL(blob);
            let link = document.createElement("a");
            link.href = blobUrl;
            link.download = "Applicant_Photo_" + currentPhotoAppNo + ".jpg"; // इसी नाम से सेव होगा
            document.body.appendChild(link);
            link.click(); // ऑटोमैटिक क्लिक (डायरेक्ट डाउनलोड)
            document.body.removeChild(link);
            window.URL.revokeObjectURL(blobUrl);
            
            btn.innerText = "Download Photo"; // बटन को वापस नॉर्मल करना
        })
        .catch(error => {
            console.error("Download fail hua:", error);
            // अगर किसी वजह से प्रॉक्सी ब्लॉक हो जाए, तो बैकअप प्लान
            let link = document.createElement("a");
            link.href = currentPhotoUrl;
            link.download = "Applicant_Photo_" + currentPhotoAppNo + ".jpg";
            link.target = "_blank";
            link.click();
            btn.innerText = "Download Photo";
        });
}
</script>

</body>
</html>
